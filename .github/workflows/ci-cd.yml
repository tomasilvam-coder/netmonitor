name: CI/CD Pipeline NetMonitor
on:
  push:
    branches: [ "main" ]
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/netmonitor-app:latest .
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/netmonitor-nginx:latest ./nginx
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/netmonitor-app:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/netmonitor-nginx:latest
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - run: aws ecs update-service --cluster netmonitor --service netmonitor-svc --force-new-deployment
