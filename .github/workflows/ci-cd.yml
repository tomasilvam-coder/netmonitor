name: CI/CD Pipeline NetMonitor

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push App
      run: |
        docker build -t tomas230000/netmonitor-app:latest .
        docker push tomas230000/netmonitor-app:latest

    - name: Build and Push Nginx
      run: |
        docker build -t tomas230000/netmonitor-nginx:latest -f Dockerfile.nginx .
        docker push tomas230000/netmonitor-nginx:latest

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Deploy to ECS
      run: aws ecs update-service --cluster netmonitor --service netmonitor-svc --force-new-deployment
    
